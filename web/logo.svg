<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="UCI Fantasy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset=".55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1640"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".28" r=".6">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#glow)"/>

  <!-- Tempo-Streifen -->
  <g stroke-linecap="round">
    <line x1="8" y1="50" x2="34" y2="50" stroke="#93c5fd" stroke-opacity=".55" stroke-width="4"/>
    <line x1="4" y1="62" x2="26" y2="62" stroke="url(#gold)" stroke-width="4"/>
    <line x1="10" y1="74" x2="28" y2="74" stroke="#93c5fd" stroke-opacity=".4" stroke-width="4"/>
  </g>

  <!-- Laufräder -->
  <g fill="none" stroke="#fff" stroke-width="5.5">
    <circle cx="38" cy="90" r="19"/>
    <circle cx="96" cy="90" r="19"/>
  </g>
  <g fill="#fff"><circle cx="38" cy="90" r="3"/><circle cx="96" cy="90" r="3"/></g>

  <!-- Rahmen -->
  <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="38,90 62,90 54,66 38,90"/>
    <polyline points="54,66 86,64 62,90"/>
    <polyline points="86,64 96,90"/>
    <path d="M86 64 l4 -4 h5 q4 0 4 4 v3"/>
    <path d="M50 64 h9" stroke="#fff" stroke-width="4"/>
  </g>

  <!-- Fahrer:in in Aero-Haltung -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 72 L58 82 L52 93" stroke-width="7" stroke-opacity=".55"/>  <!-- Bein hinten -->
    <path d="M55 61 L83 50" stroke-width="12"/>                             <!-- Oberkörper -->
    <path d="M82 51 L95 59 L97 64" stroke-width="7"/>                       <!-- Arm -->
    <path d="M56 62 L74 70 L66 94" stroke-width="8"/>                       <!-- Bein vorn -->
  </g>
  <!-- Kopf mit Aero-Helm (Tropfenform) -->
  <circle cx="92" cy="44" r="8" fill="#fff"/>
  <path d="M86 38 Q78 38 74 44 Q82 44 88 47 Z" fill="#fff"/>
  <path d="M93 41 h6" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>

  <!-- Siegerstern -->
  <path d="M104 6 l4.3 8.7 9.6 1.4 -6.95 6.8 1.64 9.55 -8.6-4.5 -8.6 4.5 1.64-9.55 -6.95-6.8 9.6-1.4z"
        fill="url(#gold)" stroke="#0b1640" stroke-width="2" stroke-linejoin="round"/>
</svg>
