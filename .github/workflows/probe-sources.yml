name: Datenquellen testen (einmalig)

on:
  push:
    branches: [claude/dreamy-ride-47psvw]
    paths: [tools/probe_sources.py, .github/workflows/probe-sources.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe_sources.py
