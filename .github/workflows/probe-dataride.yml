name: DataRide-Beispieldaten laden

# Holt einmalig echte Antworten von UCI DataRide (Saisons, Rangliste, Tour de France 2025 Etappe 1) nach
# tests/datasync/fixtures/ und committet sie auf den gestarteten Zweig – Grundlage für Tests mit echten Daten.
on:
  workflow_dispatch:
  push:                       # einmal beim Ändern des Skripts auf einem Arbeitszweig
    branches-ignore: [main]
    paths: [datasync/probe.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python datasync/probe.py
      - name: Beispieldaten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/datasync/fixtures
          git commit -m "DataRide-Beispieldaten (Workflow)" || exit 0
          git push origin HEAD:"$GITHUB_REF_NAME"
