name: Rennergebnisse laden (UCI)

# Rennkalender und Ergebnislisten (Rang, Zeit, UCI-Punkte) aller Rennen der Saison.
# Täglich um 20:00 Uhr deutscher Zeit (gestartet vom Zeitplaner in der Datenbank); übernimmt die Punkte auch in die Fantasy-Wertung.
# Der erste Lauf baut die ganze Saison auf (einige Stunden), danach nur Neues.

on:
  workflow_dispatch:
    inputs:
      neu_laden:
        description: "Auch schon geladene Rennen neu holen"
        type: boolean
        default: false
      saison:
        description: "Andere Saison laden, z. B. 2025 (leer = aktuelle)"
        required: false
        default: ""
      klassen:
        description: "Nur diese Rennklassen, z. B. CN,CC,CM (leer = alle)"
        required: false
        default: ""

concurrency:
  group: race-results
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pcs_sync/requirements.txt
      - run: python race_results.py
        working-directory: pcs_sync
        env:
          REFRESH: ${{ inputs.neu_laden && '1' || '' }}
          CLASSES: ${{ inputs.klassen }}
          SEASON_YEAR: ${{ inputs.saison }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
