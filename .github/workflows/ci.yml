name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04   # Playwright-Browser offiziell unterstützt
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Pakete für die Tests des Datenabrufs
        run: pip install -q -r datasync/requirements.txt
      - name: Browser für den Oberflächentest
        run: npx playwright install --with-deps chromium
      - name: App-Dateien prüfen
        run: for f in web/*.js web/views/*.js; do node --check "$f"; done
      - name: Datenabruf, Spiellogik und Oberfläche testen
        run: npm test
