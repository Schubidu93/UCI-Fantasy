name: App veröffentlichen

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-app.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Supabase-Zugang eintragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY fehlt (Supabase → Project Settings → API → anon public)."
            exit 1
          fi
          URL="$(echo "$SUPABASE_URL" | tr -d '[:space:]')"
          URL="${URL%/}"; URL="${URL%/rest/v1}"; URL="${URL%/auth/v1}"
          printf 'export default {\n  url: "%s",\n  anonKey: "%s",\n};\n' "$URL" "$(echo "$SUPABASE_ANON_KEY" | tr -d '[:space:]')" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
