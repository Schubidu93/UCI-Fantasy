name: Ergebnisse abrufen (UCI)

on:
  schedule:
    - cron: "0 5 * * *"    # täglich 05:00 UTC; die UCI rechnet ihr Ranking wöchentlich neu
  workflow_dispatch:        # zusätzlich per Knopfdruck startbar

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade -r pcs_sync/requirements.txt
      - run: python sync.py
        working-directory: pcs_sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
