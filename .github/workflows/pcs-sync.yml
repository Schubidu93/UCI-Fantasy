name: Ergebnisse abrufen (UCI)

on:
  schedule:
    - cron: "0 5 * * *"     # täglich 05:00 UTC: Fahrer in Kadern
    - cron: "30 5 * * 3"    # mittwochs 05:30 UTC: alle Fahrer der Weltrangliste (nach dem Fahrerimport)
  workflow_dispatch:
    inputs:
      umfang:
        description: "Welche Fahrer?"
        type: choice
        options: [kader, alle]
        default: kader

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade -r pcs_sync/requirements.txt
      - run: python sync.py
        working-directory: pcs_sync
        env:
          MODE: ${{ (github.event.schedule == '30 5 * * 3' || inputs.umfang == 'alle') && 'alle' || 'kader' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
